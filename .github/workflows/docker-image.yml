name: Fork container release

on:
  push:
    branches: [pan-v4-release]
    tags: ['v*-pan-v4.*']
    paths:
      - '.github/workflows/docker-image.yml'
      - 'docker/pan-v4-version'

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/t0nyz0/docker-wyze-bridge

jobs:
  test:
    if: github.repository == 't0nyz0/docker-wyze-bridge'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
      - name: Race tests and vet
        run: |
          go test -race ./...
          go vet ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read release version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/pan-v4-release ]]; then
            TAG="v$(tr -d '\r\n' < docker/pan-v4-version)"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pan-v4\.[0-9]+$ ]]
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push native architecture
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/t0nyz0/docker-wyze-bridge
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.title=Wyze Bridge - Pan v4 fork
            org.opencontainers.image.description=Integrated Pan v4 video with native 4K HEVC and H264 preview
          cache-from: type=gha,scope=pan-v4-${{ matrix.arch }}
          cache-to: type=gha,scope=pan-v4-${{ matrix.arch }},mode=max
          provenance: false
      - name: Verify the published image without camera access
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release-proof
          docker pull "$IMAGE@$DIGEST"
          docker run -d --network none --name release-smoke "$IMAGE@$DIGEST"
          trap 'docker logs release-smoke; docker rm -f -v release-smoke' EXIT
          for attempt in $(seq 1 30); do
            if docker exec release-smoke wget -qO- http://127.0.0.1:5080/api/version > release-proof/version.json &&
               docker exec release-smoke wget -qO- http://127.0.0.1:1984/api/streams > release-proof/streams.json; then
              break
            fi
            sleep 1
          done
          jq -e --arg version "$VERSION" '.version == $version and .go2rtc_version == "1.9.14"' release-proof/version.json
          jq -e 'type == "object"' release-proof/streams.json
          docker exec release-smoke test -s /usr/share/doc/wyze-bridge/LICENSE
          docker exec release-smoke test -s /usr/share/doc/wyze-bridge/THIRD_PARTY_NOTICES.md
          docker exec release-smoke ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=10 -frames:v 10 -c:v libx264 -f null -
          docker exec release-smoke apk info -v > release-proof/runtime-packages.txt
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg arch "$ARCH" --arg version "$VERSION" --arg revision "$GITHUB_SHA" \
            '{image:$image,digest:$digest,architecture:$arch,version:$version,revision:$revision}' > release-proof/image.json
          echo "$IMAGE@$DIGEST" > release-proof/$ARCH.digest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-proof-${{ matrix.arch }}
          path: release-proof/
          if-no-files-found: error

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-proof-*
          path: release-proof
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish and verify the multi-architecture version
        run: |
          set -euo pipefail
          VERSION=$(jq -er '.version' release-proof/release-proof-amd64/image.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-pan-v4\.[0-9]+$ ]]
          jq -e --arg version "$VERSION" --arg revision "$GITHUB_SHA" \
            '.version == $version and .revision == $revision' release-proof/release-proof-arm64/image.json
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::Version $VERSION already exists; bump docker/pan-v4-version instead of overwriting it."
            exit 1
          fi
          AMD64=$(cat release-proof/release-proof-amd64/amd64.digest)
          ARM64=$(cat release-proof/release-proof-arm64/arm64.digest)
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            --annotation "index:org.opencontainers.image.description=Wyze Bridge fork with integrated Pan v4 4K HEVC and H264 preview" \
            "$AMD64" "$ARM64"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw > release-proof/manifest.json
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64","linux/arm64"]' release-proof/manifest.json
          docker buildx imagetools inspect "$IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: release-proof/manifest.json
          if-no-files-found: error
